[mod-setting-name]
Noxys_Multidirectional_Trains-on_nth_tick=Mätfördröjning
Noxys_Multidirectional_Trains-enabled=Aktiverad
Noxys_Multidirectional_Trains-station_limits=Justera stationsgränser

[mod-setting-description]
Noxys_Multidirectional_Trains-on_nth_tick=Längsta fördröjning i tick mellan avgång från stationen och hastighetsmätningen för rotation.
Noxys_Multidirectional_Trains-enabled=Aktiverar tågrotation. Stäng av detta om du vill ta bort modden och få alla tåg roterade tillbaka.
Noxys_Multidirectional_Trains-station_limits=Gör att du kan använda stationsgränsen 1 utan att flerriktade tåg beter sig konstigt och ständigt åker från en sådan station till nästa utan att gå vidare i tidtabellen. När detta är aktiverat höjs stationsgränsen tillfälligt till 2 så att tågen kan rotera korrekt. Det kan ge oväntade bieffekter, till exempel att för många tåg försöker åka till stationen. Inaktivera alternativet om det händer.


